const slides=[
['CASE APPLICATION 03 / WEEK 13','The anatomy of a collapse','Lehman Brothers · Lessons in management, ethics and risk.','Zholan Ramazan / 2405 IS / 27 November 2026','tower','Today I will explain why Lehman Brothers collapsed and what future managers can learn.'],
['01 / CONTEXT','September 15, 2008','Lehman Brothers filed for Chapter 11 bankruptcy. Its failure shook confidence in financial markets around the world.','A financial crisis. A management lesson.','chart','The company failed during a wider financial crisis. Its own management decisions also contributed to the collapse.'],
['02 / QUESTION 1','Profit over ethics','Misleading financial reporting and ignored ethical concerns damaged trust. Short-term gains should never outweigh transparency.','Honesty • Responsibility • Transparency','scale','In my opinion, the company acted irresponsibly. Investors needed accurate information to make decisions.'],
['03 / QUESTION 2','A culture of risk','Excessive risk-taking was rewarded. Employees who questioned decisions were ignored. Oliver Budde raised concerns that management did not resolve.','Incentives shape behavior.','culture','The culture encouraged employees to take risks for rewards. People who spoke up were not heard.'],
['04 / QUESTION 3','Leadership failure','Executives exceeded internal risk limits and made poor decisions. The bankruptcy examiner criticized leadership and misleading reports.','Accountability starts at the top.','lead','Executives should protect the company and investors. The examiner criticized their actions; Fuld’s lawyer disputed his knowledge of the accounting treatment.'],
['05 / QUESTION 3','The $50 billion illusion','Repo 105 temporarily removed around $50 billion of assets from the balance sheet near reporting dates. This made the financial position look stronger.','Approximate amount • Case source','repo','Repo 105 was an accounting treatment, not a permanent reduction in risk. The case says the auditor knew of its use but did not challenge it.'],
['06 / ANALYSIS','The chain of failure','Risk incentives, weak controls and misleading reporting reinforced each other. Market stress exposed the company’s vulnerability.','Conceptual causal model — not market data','domino','These are connected management failures. The financial market crisis also played an important role.'],
['07 / QUESTION 4','Build the safeguards','Strengthen risk limits, report honestly, protect employees who speak up, reward responsible decisions and improve independent audit oversight.','Prevention reduces risk; it cannot guarantee survival.','shield','Better management could have reduced the risk of failure. Independent oversight and safe reporting channels are important.'],
['08 / QUESTION 5','Why laws are not enough','The Sarbanes–Oxley Act strengthened shareholder protection, but laws alone cannot remove pressure for profits and bonuses.','Rules + ethical leadership + culture','law','It is reasonable to expect ethical business behavior. Laws need to be supported by responsible leaders and effective controls.'],
['09 / CONCLUSION','Trust is an asset.','Financial success is not enough. Ethical leadership, transparent reporting and effective risk management support long-term organizational success.','Source: Week 13 · Case Application 3 · Lessons from Lehman Brothers','trust','My conclusion is that managers must protect trust, not just profits. Thank you for listening.']];

if(type==='scale'){s='<path d="M220 65V300M145 310H295M65 115L375 170" stroke="#d7b5a0" stroke-width="9" stroke-linecap="round"/><path d="M85 120L35 240H135ZM355 166L305 286H405Z" fill="#a63c43" fill-opacity=".7" stroke="#ed9d92" stroke-width="2"/><text x="85" y="265" text-anchor="middle" font-size="20">Ethics</text><text x="355" y="312" text-anchor="middle" font-size="20">Profit</text>'}
if(type==='shield'){s='<path d="M220 45L370 100V205Q350 290 220 350Q90 290 70 205V100Z" fill="#71363e" stroke="#f4a69a" stroke-width="3"/><path d="M220 70L345 115V200Q320 270 220 320Q120 270 95 200V115Z" fill="#25232a" stroke="#bc7771"/><path class="draw" d="M150 190L200 240 290 145" fill="none" stroke="#edb5a0" stroke-width="13" stroke-linecap="round"/>'}
if(type==='lead'){s='<circle cx="225" cy="95" r="42" fill="#aa5558" stroke="#efaba2" stroke-width="2"/><path d="M165 195Q165 135 225 135Q285 135 285 195Z" fill="#8b4148" stroke="#e8a39c"/><path d="M225 200V235M80 235H370M80 235V270M225 235V270M370 235V270" stroke="#ef8a80" stroke-width="2" fill="none"/>';['Risk limits','Reporting','Oversight'].forEach((v,i)=>{s+=`<rect x="${15+i*145}" y="270" width="130" height="62" rx="8" fill="#39272d" stroke="#a95659"/><text x="${80+i*145}" y="306" text-anchor="middle" font-size="15">${v}</text>`})}
if(type==='law'){['LAW','CONTROLS','ETHICS'].forEach((v,i)=>{s+=cube(65+i*105,100+i*55,110,160-i*20,24,'#803d46')+`<text x="${120+i*105}" y="${150+i*55}" text-anchor="middle" font-size="15" font-weight="bold">${v}</text>`});s+='<text x="225" y="355" font-size="15" text-anchor="middle">Three layers of accountability</text>'}
if(type==='trust'){s='<circle cx="225" cy="185" r="145" stroke="#7c4249" fill="none" stroke-width="2" stroke-dasharray="5 9"/><circle cx="225" cy="185" r="75" fill="#6d303c" stroke="#ed9b90" stroke-width="2"/><text x="225" y="195" text-anchor="middle" font-size="28" font-weight="bold">TRUST</text>';[['Ethics',225,35],['Transparency',80,290],['Risk control',370,290]].forEach(([v,x,y])=>{s+=`<path d="M225 185L${x} ${y}" stroke="#c67b76" opacity=".5"/><rect x="${x-65}" y="${y-20}" width="130" height="40" rx="20" fill="#30252c" stroke="#a95a60"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14">${v}</text>`})}
return `<svg viewBox="0 0 450 390" role="img" aria-label="Conceptual ${type} infographic"><defs><filter id="glow-${idx}"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".6"/></filter></defs><g class="float" filter="url(#glow-${idx})">${s}</g></svg>`}
